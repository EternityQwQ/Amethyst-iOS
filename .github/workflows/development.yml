name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened, synchronize]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

# 并发控制：同一分支/PR 新的推送会取消仍在排队或运行的旧构建。
# 这能显著缓解 macos-14 runner 供应紧张导致的"一直卡在队列中"问题：
# 开发中频繁 push 时，旧构建被立即取消，runner 资源让给最新提交。
# workflow_dispatch 手动触发也纳入同一组，避免与自动触发互相堆积。
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-14

    steps:
      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version || true

      - name: Install GNU Make
        run: |
          brew update
          brew install make

      - name: Install Java 8 (Temurin) via Homebrew
        run: |
          brew install --cask temurin@8 || true

      - name: Install ldid
        run: |
          brew install ldid || true

      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove stale MobileGL gitlink
        # MobileGL submodule 已完整移除（.gitmodules 中无对应条目），
        # 但并行 agent 操作或本地 index 残留可能反复引入孤立 gitlink，
        # 导致后续 git submodule update --init 因找不到 URL 而 exit 128。
        # checkout 后、submodule 初始化前强制清理。
        # MobileGlues submodule 同样已移除（源码直接内嵌仓库，对齐 Ynnyny）。
        run: |
          git rm --cached -f Natives/external/MobileGL 2>/dev/null || true
          git config --remove-section submodule.Natives/external/MobileGL 2>/dev/null || true
          git rm --cached -f Natives/external/MobileGlues 2>/dev/null || true
          git config --remove-section submodule.Natives/external/MobileGlues 2>/dev/null || true

      - name: Checkout repository submodules
        env:
          # MobileGL 上游 LFS 配额已用尽，其 LFS 文件（tools/trace_replay/fixtures）
          # 与 iOS 构建无关，跳过 smudge 避免 submodule checkout 失败 exit 128
          GIT_LFS_SKIP_SMUDGE: "1"
        run: git submodule update --init --recursive

      - name: Download MobileGL iOS dylib (Amethyst-IOS-MGL only)
        # 仅在 Amethyst-IOS-MGL 分支或手动触发时下载 MobileGL iOS dylib + MoltenVK iOS。
        # MobileGL dylib 由 EternityQwQ/MobileGL 仓库的 CI 构建（ios-dylib.yml workflow），
        # artifact 名格式：libMobileGL-ios-arm64-<run_id>。
        # 跨仓库下载 artifact 需要令牌：使用仓库 secret MOBILEGL_CI_TOKEN（PAT，加密存储）。
        if: github.ref == 'refs/heads/Amethyst-IOS-MGL' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.MOBILEGL_CI_TOKEN }}
        run: |
          set -e
          mkdir -p Natives/external/MobileGL

          # 动态获取 MobileGL iOS dylib 最新成功 run（避免 artifact 过期导致构建失败）
          # 优先尝试已知的 run id（30808897311），失败则回退到最新成功 run
          KNOWN_RUN_ID=30808897311
          KNOWN_ARTIFACT="libMobileGL-ios-arm64-${KNOWN_RUN_ID}"

          echo "尝试下载已知 run id=${KNOWN_RUN_ID}, artifact=${KNOWN_ARTIFACT}"
          if gh run download ${KNOWN_RUN_ID} --repo EternityQwQ/MobileGL \
            --name ${KNOWN_ARTIFACT} --dir Natives/external/MobileGL 2>/dev/null; then
            echo "已知 run id 下载成功"
            RUN_ID=${KNOWN_RUN_ID}
          else
            echo "已知 run id 下载失败（artifact 可能已过期或 run 不存在），回退到最新成功 run"
            RUN_ID=$(gh run list --repo EternityQwQ/MobileGL \
              --workflow ios-dylib.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')
            if [ -z "${RUN_ID}" ]; then
              echo "ERROR: 未找到 MobileGL iOS dylib 的成功 workflow run"
              exit 1
            fi
            ARTIFACT_NAME="libMobileGL-ios-arm64-${RUN_ID}"
            echo "使用最新成功 run: id=${RUN_ID}, artifact=${ARTIFACT_NAME}"
            gh run download ${RUN_ID} --repo EternityQwQ/MobileGL \
              --name ${ARTIFACT_NAME} --dir Natives/external/MobileGL
          fi

          ls -lh Natives/external/MobileGL/

          # 修复 install_name（CMake POST_BUILD 也会做，提前做避免 CMake 阶段问题）
          if [ -f Natives/external/MobileGL/libMobileGL.dylib ]; then
            install_name_tool -id @rpath/libMobileGL.dylib Natives/external/MobileGL/libMobileGL.dylib
            echo "libMobileGL.dylib install_name 修复完成:"
            otool -D Natives/external/MobileGL/libMobileGL.dylib
          else
            echo "ERROR: libMobileGL.dylib 未下载到 Natives/external/MobileGL/"
            ls -la Natives/external/MobileGL/
            exit 1
          fi

          # 可选：下载 MoltenVK iOS 最新 release（MobileGL DirectVulkan 后端运行时依赖）
          # 失败不阻断构建（Natives/resources/Frameworks/libMoltenVK.dylib 已有旧版作为 fallback）
          # 注意：KhronosGroup/MoltenVK release 的 asset 命名格式为 MoltenVK-ios.tar / MoltenVK-all.tar
          # （非 MoltenVK.tar.gz），且为未压缩 tar（用 tar -xf 而非 tar -xzf）
          echo "=== 尝试下载 MoltenVK iOS 最新 release ==="
          TEMP_MVK=$(mktemp -d)
          if gh release download --repo KhronosGroup/MoltenVK --dir ${TEMP_MVK} --pattern 'MoltenVK-ios.tar'; then
            tar -xf ${TEMP_MVK}/MoltenVK-ios.tar -C ${TEMP_MVK}
            # 查找 iOS dylib（路径可能是 MoltenVK/dylib/iOS/libMoltenVK.dylib 或 MoltenVK/MoltenVK/dylib/iOS/...）
            MVK_DYLIB=$(find ${TEMP_MVK} -name 'libMoltenVK.dylib' -path '*/iOS/*' | head -1)
            if [ -n "${MVK_DYLIB}" ] && [ -f "${MVK_DYLIB}" ]; then
              cp "${MVK_DYLIB}" Natives/external/MobileGL/libMoltenVK.dylib
              install_name_tool -id @rpath/libMoltenVK.dylib Natives/external/MobileGL/libMoltenVK.dylib
              echo "MoltenVK iOS dylib 下载完成 (source: ${MVK_DYLIB}):"
              ls -lh Natives/external/MobileGL/libMoltenVK.dylib
              otool -D Natives/external/MobileGL/libMoltenVK.dylib
            else
              echo "WARNING: MoltenVK-ios.tar 解压后未找到 iOS dylib，列出所有 libMoltenVK*:"
              find ${TEMP_MVK} -name 'libMoltenVK*' -print 2>/dev/null || true
            fi
          else
            echo "WARNING: MoltenVK release 下载失败，跳过（使用 Natives/resources/Frameworks/libMoltenVK.dylib fallback）"
          fi
          rm -rf ${TEMP_MVK}

          echo "=== MobileGL 集成资源就绪 ==="
          ls -lh Natives/external/MobileGL/

      - name: Build for ${{ matrix.platform_name }}
        env:
          IPHONEOS_DEPLOYMENT_TARGET: 14.0
          CONFIG_CURSEFORGE_API_KEY: ${{ secrets.CONFIG_CURSEFORGE_API_KEY }}
        run: |
          set -o pipefail
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=0

          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}

            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1

          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1

          else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
          fi

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: com.air-devs.air-${{ matrix.platform_name }}.ipa
          path: artifacts/com.air-devs.air-*-${{ matrix.platform_name }}.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: com.air-devs.air-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/com.air-devs.air-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload PojavLauncher.dSYM
        if: matrix.platform_name == 'ios' && success()
        uses: actions/upload-artifact@v4
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
